<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2a1846">
  <title>Mélo Pop</title>
  <meta name="description" content="Mélo Pop : un jeu de notes à aligner, 60 niveaux en 6 mondes musicaux.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mélo Pop">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta property="og:title" content="Mélo Pop">
  <meta property="og:description" content="Aligne les notes, compose ta mélodie !">
  <meta property="og:image" content="https://smob-fr.github.io/melopop/www/icons/icon-512.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Chargement -->
  <section id="loading" class="screen active">
    <div class="center">
      <div class="logo-gems">
        <div class="gem c0"><i>♪&#xFE0E;</i></div><div class="gem c2"><i>♩&#xFE0E;</i></div><div class="gem c4"><i>♭&#xFE0E;</i></div>
      </div>
      <h1 class="title"><span>Mélo</span><span class="pop">Pop</span></h1>
      <div class="loader"><div></div></div>
      <p class="muted">Accordage des notes…</p>
    </div>
  </section>

  <!-- Accueil -->
  <section id="home" class="screen">
    <header class="bar">
      <button class="pill lives-btn" data-icon="heart"><span class="lives">5</span><small class="lives-timer"></small></button>
      <div class="pill star-pill" data-icon="star"><span class="total-stars">0</span></div>
    </header>
    <div class="center home-center">
      <div class="logo-gems big">
        <div class="gem c0"><i>♪&#xFE0E;</i></div><div class="gem c2"><i>♩&#xFE0E;</i></div><div class="gem c4"><i>♭&#xFE0E;</i></div>
        <div class="gem c3"><i>♬&#xFE0E;</i></div><div class="gem c5"><i>♯&#xFE0E;</i></div>
      </div>
      <h1 class="title big"><span>Mélo</span><span class="pop">Pop</span></h1>
      <p class="tagline">Aligne les notes, compose ta mélodie</p>
      <button id="play" class="btn big play-btn" data-icon="play"><span id="play-label">Commencer</span></button>
      <div class="home-row">
        <button id="gift-btn" class="round-btn" data-icon="gift"><span>Cadeau</span></button>
        <button id="home-shop" class="round-btn" data-icon="cart"><span>Boutique</span></button>
        <button id="home-help" class="round-btn" data-icon="help"><span>Aide</span></button>
        <button id="home-settings" class="round-btn" data-icon="gear"><span>Réglages</span></button>
      </div>
    </div>
  </section>

  <!-- Carte -->
  <section id="map" class="screen">
    <header class="bar">
      <button id="map-back" class="icon-btn" data-icon="back" aria-label="Accueil"></button>
      <button class="pill lives-btn" data-icon="heart"><span class="lives">5</span><small class="lives-timer"></small></button>
      <div class="pill star-pill" data-icon="star"><span class="total-stars">0</span></div>
      <button id="map-shop" class="icon-btn" data-icon="cart" aria-label="Boutique"></button>
      <button id="map-settings" class="icon-btn" data-icon="gear" aria-label="Réglages"></button>
    </header>
    <div id="level-list"></div>
  </section>

  <!-- Partie -->
  <section id="game" class="screen">
    <header class="hud">
      <button id="pause" class="icon-btn" data-icon="pause" aria-label="Pause"></button>
      <div id="moves-badge" class="moves-badge"><b id="moves">0</b><small>coups</small></div>
      <div class="goals-wrap"><small id="level-title">Niveau</small><div id="goals"></div></div>
    </header>
    <div class="scorebar">
      <div class="progress"><div id="progress-fill"></div>
        <i style="left:45.5%" data-icon="star"></i><i style="left:68.2%" data-icon="star"></i><i style="left:97%" data-icon="star"></i></div>
      <b id="score">0</b>
    </div>
    <div class="board-wrap">
      <div class="board-frame"><div id="board"></div></div>
      <div id="cheer"></div>
    </div>
    <footer class="boosters">
      <button class="booster" data-booster="hammer" data-icon="hammer" aria-label="Marteau"><span class="count">3</span><small>Marteau</small></button>
      <button class="booster" data-booster="shuffle" data-icon="shuffle" aria-label="Mélange"><span class="count">2</span><small>Mélange</small></button>
    </footer>
  </section>

  <!-- Comment jouer -->
  <section id="help" class="screen">
    <header class="bar">
      <button id="help-back" class="icon-btn" data-icon="back" aria-label="Retour"></button>
      <h2 class="bar-title">Comment jouer</h2>
      <span class="icon-btn ghost-spacer"></span>
    </header>
    <div id="help-list"></div>
  </section>

  <!-- Boutique -->
  <section id="shop" class="screen">
    <header class="bar">
      <button id="shop-back" class="icon-btn" data-icon="back" aria-label="Retour"></button>
      <h2 class="bar-title">Boutique</h2>
      <span class="icon-btn ghost-spacer"></span>
    </header>
    <div id="shop-inv" class="shop-inv"></div>
    <div id="shop-list"></div>
  </section>

  <!-- Tutoriel -->
  <div id="tut" hidden>
    <div id="tut-spot" hidden></div>
    <div id="tut-hand" hidden><span class="finger"></span></div>
    <div id="tut-bubble" hidden></div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="modal"><div id="modal-box"></div></div>
  <div id="fake-banner">Bannière publicitaire (simulation)</div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
